name: Windows Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: "qtserialport qtwebsockets"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          setup-python: false
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/release `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build backend
        shell: pwsh
        run: |
          cmake --build build/release --parallel

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip.install -y --no-progress

      - name: Create portable application
        shell: pwsh
        run: |
          $packageDir = "stage\PressureMat"

          New-Item -ItemType Directory -Force "stage" | Out-Null
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          Copy-Item `
            "build\release\pressure_mat_backend.exe" `
            "$packageDir\PressureMat.exe"

          Copy-Item `
            "build\release\frontend" `
            "$packageDir\frontend" `
            -Recurse

          windeployqt `
            --release `
            --compiler-runtime `
            --dir $packageDir `
            "$packageDir\PressureMat.exe"

      - name: Create single executable
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $sfxModule = "C:\Program Files\7-Zip\7z.sfx"
          $archive = "stage\PressureMat.7z"
          $config = "stage\sfx-config.txt"
          $outputExe = "stage\PressureMat.exe"

          if (-not (Test-Path $sevenZip)) {
            throw "7z.exe not found: $sevenZip"
          }

          if (-not (Test-Path $sfxModule)) {
            throw "7z.sfx not found: $sfxModule"
          }

          & $sevenZip a `
            -t7z `
            $archive `
            ".\stage\PressureMat\*" `
            -mx=9

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create 7-Zip archive"
          }

          $configLines = @(
            ";!@Install@!UTF-8!"
            'Title="Pressure Mat Visualizer"'
            'RunProgram="PressureMat.exe"'
            ";!@InstallEnd@!"
          )

          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD $config),
            $configLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          $sfxBytes = [System.IO.File]::ReadAllBytes(
            (Join-Path $PWD $sfxModule)
          )

          $configBytes = [System.IO.File]::ReadAllBytes(
            (Join-Path $PWD $config)
          )

          $archiveBytes = [System.IO.File]::ReadAllBytes(
            (Join-Path $PWD $archive)
          )

          $outputPath = Join-Path $PWD $outputExe

          $stream = [System.IO.File]::Create($outputPath)

          try {
            $stream.Write($sfxBytes, 0, $sfxBytes.Length)
            $stream.Write($configBytes, 0, $configBytes.Length)
            $stream.Write($archiveBytes, 0, $archiveBytes.Length)
          }
          finally {
            $stream.Dispose()
          }

          if (-not (Test-Path $outputExe)) {
            throw "PressureMat.exe was not created"
          }

          Write-Host "Single executable created:"
          Get-Item $outputExe

      - name: Create customer ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "stage\PressureMat.exe" `
            -DestinationPath "stage\PressureMat-Windows-x64.zip" `
            -CompressionLevel Optimal

          Write-Host "Final customer ZIP:"
          Get-Item "stage\PressureMat-Windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureMat-Windows-x64
          path: stage/PressureMat-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "stage\PressureMat-Windows-x64.zip"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset `
              --title "Pressure Mat $tag" `
              --generate-notes
          }