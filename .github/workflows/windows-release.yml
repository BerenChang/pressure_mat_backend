name: Windows Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: "qtserialport qtwebsockets"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          setup-python: false
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/release `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build backend
        shell: pwsh
        run: |
          cmake --build build/release --parallel

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip.install -y --no-progress

      - name: Create single-file portable application
        shell: pwsh
        run: |
          $packageDir = "stage\PressureMat"

          # Create staging directory
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          # Copy backend executable
          Copy-Item `
            "build\release\pressure_mat_backend.exe" `
            "$packageDir\PressureMat.exe"

          # Copy frontend
          Copy-Item `
            "build\release\frontend" `
            "$packageDir\frontend" `
            -Recurse

          # Deploy Qt DLLs and runtime dependencies
          windeployqt `
            --release `
            --compiler-runtime `
            --dir $packageDir `
            "$packageDir\PressureMat.exe"

          # Locate 7-Zip
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          $sevenZipSfx = "${env:ProgramFiles}\7-Zip\7z.sfx"

          if (!(Test-Path $sevenZip)) {
            throw "7z.exe was not found at $sevenZip"
          }

          if (!(Test-Path $sevenZipSfx)) {
            throw "7z.sfx was not found at $sevenZipSfx"
          }

          # Create SFX configuration
          $sfxConfig = @'
;!@Install@!UTF-8!
Title="Pressure Mat Visualizer"
RunProgram="PressureMat.exe"
;!@InstallEnd@!
'@

          $sfxConfigPath = "stage\sfx-config.txt"

          $sfxConfig | Out-File `
            -FilePath $sfxConfigPath `
            -Encoding utf8 `
            -NoNewline

          # Create 7z archive containing the complete application
          & $sevenZip a `
            -t7z `
            "stage\PressureMat.7z" `
            "$packageDir\*" `
            -mx=9

          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to create the application archive."
          }

          # Create self-extracting EXE
          $sfxExe = "stage\PressureMat.exe"

          cmd.exe /c `
            "copy /b `"$sevenZipSfx`"+`"$sfxConfigPath`"+`"stage\PressureMat.7z`" `"$sfxExe`""

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create self-extracting EXE."
          }

          if (!(Test-Path $sfxExe)) {
            throw "Self-extracting EXE was not created."
          }

          # Create customer-facing ZIP containing ONLY PressureMat.exe
          Compress-Archive `
            -Path $sfxExe `
            -DestinationPath "stage\PressureMat-Windows-x64.zip" `
            -CompressionLevel Optimal

          # Show final package contents
          Write-Host ""
          Write-Host "========== Final customer package =========="
          Get-ChildItem "stage\PressureMat-Windows-x64.zip"
          Write-Host ""
          Write-Host "The ZIP contains:"
          & $sevenZip l "stage\PressureMat-Windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureMat-Windows-x64
          path: stage/PressureMat-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "stage\PressureMat-Windows-x64.zip"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset `
              --title "Pressure Mat $tag" `
              --generate-notes
          }