name: Windows Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: "qtserialport qtwebsockets"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          setup-python: false
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build/release `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build backend
        shell: pwsh
        run: |
          cmake --build build/release --parallel

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip.install -y --no-progress

      - name: Download 7-Zip Extra
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "stage" | Out-Null
          New-Item -ItemType Directory -Force "stage\7zip-extra" | Out-Null

          $url = "https://www.7-zip.org/a/7z2603-extra.7z"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "stage\7zip-extra.7z"

          & "C:\Program Files\7-Zip\7z.exe" x `
            "stage\7zip-extra.7z" `
            "-ostage\7zip-extra" `
            -y

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract 7-Zip Extra"
          }

          Write-Host "7-Zip Extra contents:"
          Get-ChildItem "stage\7zip-extra" -Recurse

      - name: Create single executable
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $sfxModule = Join-Path $PWD "stage\7zip-extra\7zS.sfx"

          $archive = Join-Path $PWD "stage\PressureMat.7z"
          $config = Join-Path $PWD "stage\sfx-config.txt"
          $outputExe = Join-Path $PWD "stage\PressureMat.exe"

          if (-not (Test-Path $sfxModule)) {
            throw "Installer SFX module not found: $sfxModule"
          }

          # Create compressed application archive
          & $sevenZip a `
            -t7z `
            $archive `
            ".\stage\PressureMat\*" `
            -mx=9

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create PressureMat.7z"
          }

          # SFX configuration:
          # extract to a temporary directory and launch PressureMat.exe
          $configLines = @(
            ";!@Install@!UTF-8!"
            'Title="Pressure Mat Visualizer"'
            'Progress="no"'
            'RunProgram="PressureMat.exe"'
            ";!@InstallEnd@!"
          )

          [System.IO.File]::WriteAllLines(
            $config,
            $configLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          $sfxBytes = [System.IO.File]::ReadAllBytes($sfxModule)
          $configBytes = [System.IO.File]::ReadAllBytes($config)
          $archiveBytes = [System.IO.File]::ReadAllBytes($archive)

          $stream = [System.IO.File]::Create($outputExe)

          try {
            $stream.Write($sfxBytes, 0, $sfxBytes.Length)
            $stream.Write($configBytes, 0, $configBytes.Length)
            $stream.Write($archiveBytes, 0, $archiveBytes.Length)
          }
          finally {
            $stream.Dispose()
          }

          if (-not (Test-Path $outputExe)) {
            throw "PressureMat.exe was not created"
          }

          Write-Host "Single executable created:"
          Get-Item $outputExe

      - name: Create customer ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "stage\PressureMat.exe" `
            -DestinationPath "stage\PressureMat-Windows-x64.zip" `
            -CompressionLevel Optimal

          Write-Host "Final customer ZIP:"
          Get-Item "stage\PressureMat-Windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PressureMat-Windows-x64
          path: stage/PressureMat-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "stage\PressureMat-Windows-x64.zip"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset `
              --title "Pressure Mat $tag" `
              --generate-notes
          }