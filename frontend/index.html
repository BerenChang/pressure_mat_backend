<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <title>Pressure Mat Visualizer</title>
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div>
                <h1>Pressure Mat Visualizer</h1>
                <p>28 × 56 real-time pressure data</p>
            </div>

            <div class="status-area">
                <div class="acquisition-controls">
                    <button
                        id="start-reading"
                        class="control-button start-button"
                        type="button"
                        disabled
                    >
                        Start
                    </button>
                
                    <button
                        id="stop-reading"
                        class="control-button stop-button"
                        type="button"
                        disabled
                    >
                        Stop
                    </button>
                </div>
                <div class="status-item">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="connection-status">Disconnected</span>
                </div>

                <div class="status-item">
                    <span>Rate</span>
                    <strong id="frame-rate">0 FPS</strong>
                </div>

                <div class="status-item">
                    <span>Frames</span>
                    <strong id="frame-count">0</strong>
                </div>
            </div>
        </header>

        <section class="connection-panel">
            <div class="connection-field">
                <label for="serial-port">Serial port</label>
        
                <select id="serial-port" disabled>
                    <option value="">No ports detected</option>
                </select>
            </div>
        
            <div class="connection-field">
                <label for="baud-rate">Baud rate</label>
        
                <select id="baud-rate" disabled>
                    <option value="115200">115200</option>
                    <option value="961200">961200</option>
                </select>
            </div>
        
            <div class="connection-actions">
                <button
                    id="refresh-ports"
                    class="control-button refresh-button"
                    type="button"
                    disabled
                >
                    Refresh
                </button>

                <button
                    id="connect-serial"
                    class="control-button connect-button"
                    type="button"
                    disabled
                >
                    Connect
                </button>
        
                <button
                    id="disconnect-serial"
                    class="control-button disconnect-button"
                    type="button"
                    disabled
                >
                    Disconnect
                </button>
            </div>
        </section>

        <section class="display-controls">
            <div class="slider-control">
                <div class="slider-label">
                    <label for="noise-threshold">
                        Noise threshold
                    </label>
        
                    <output id="noise-threshold-value">
                        0
                    </output>
                </div>
        
                <input
                    id="noise-threshold"
                    type="range"
                    min="0"
                    max="255"
                    step="1"
                    value="0"
                />
        
                <div class="slider-scale">
                    <span>0</span>
                    <span>255</span>
                </div>
            </div>

            <div class="slider-control">
                <div class="slider-label">
                    <label for="display-maximum">
                        Display maximum
                    </label>
            
                    <output id="display-maximum-value">
                        255
                    </output>
                </div>
            
                <input
                    id="display-maximum"
                    type="range"
                    min="1"
                    max="255"
                    step="1"
                    value="255"
                />
            
                <div class="slider-scale">
                    <span>1</span>
                    <span>255</span>
                </div>
            </div>

        </section>

        <main class="visualization-grid">
            <section class="panel">
                <div class="panel-header">
                    <h2>2D Heatmap</h2>
                    <span>Canvas</span>
                </div>

                <div class="canvas-container">
                    <canvas
                        id="heatmap"
                        width="1120"
                        height="560"
                    ></canvas>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>3D Pressure Surface</h2>
                    <span>Three.js</span>
                </div>

                <div id="surface-3d" class="surface-container"></div>
            </section>
        </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
